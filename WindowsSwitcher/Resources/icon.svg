<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#313244;stop-opacity:1" />
    </linearGradient>
    <!-- 窗口渐变 -->
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#89B4FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#89B4FA;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="windowGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CBA6F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBA6F7;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- 背景填充整个画布 -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradient)"/>

  <!-- 后层窗口（略微偏移） -->
  <g transform="translate(20, -15)">
    <rect x="120" y="140" width="280" height="220" fill="url(#windowGradient2)" stroke="#CBA6F7" stroke-width="3" opacity="0.7"/>
    <!-- 窗口红绿灯 -->
    <circle cx="150" cy="175" r="8" fill="#F38BA8"/>
    <circle cx="180" cy="175" r="8" fill="#F9E2AF"/>
    <circle cx="210" cy="175" r="8" fill="#A6E3A1"/>
  </g>

  <!-- 前层窗口（当前选中） -->
  <rect x="112" y="120" width="280" height="240" fill="url(#windowGradient)" stroke="#89B4FA" stroke-width="4"/>
  <!-- 窗口红绿灯（macOS风格） -->
  <circle cx="142" cy="155" r="8" fill="#F38BA8"/>
  <circle cx="172" cy="155" r="8" fill="#F9E2AF"/>
  <circle cx="202" cy="155" r="8" fill="#A6E3A1"/>

  <!-- 窗口内容：两个预览小窗口（表示预览程序坞） -->
  <rect x="148" y="190" width="100" height="70" fill="#1E1E2E" stroke="#89B4FA" stroke-width="2" opacity="0.9"/>
  <rect x="262" y="190" width="100" height="70" fill="#1E1E2E" stroke="#89B4FA" stroke-width="2" opacity="0.9"/>

  <!-- 程序坞圆点（表示多个窗口可切换） -->
  <circle cx="170" cy="390" r="8" fill="#A6E3A1"/>
  <circle cx="220" cy="390" r="8" fill="#89B4FA"/>
  <circle cx="270" cy="390" r="8" fill="#CBA6F7"/>
  <circle cx="320" cy="390" r="8" fill="#F38BA8"/>
  <circle cx="370" cy="390" r="8" fill="#F9E2AF"/>

  <!-- 左右切换箭头 -->
  <path d="M 80 250 L 60 250 L 60 240 L 45 255 L 60 270 L 60 260 L 80 260 Z" fill="#A6E3A1" opacity="0.8"/>
  <path d="M 432 250 L 452 250 L 452 240 L 467 255 L 452 270 L 452 260 L 432 260 Z" fill="#A6E3A1" opacity="0.8"/>
</svg>
