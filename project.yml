name: WindowsSwitcher
options:
  bundleIdPrefix: com.windowsswitcher
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"

targets:
  WindowsSwitcher:
    type: application
    platform: macOS
    sources:
      - path: WindowsSwitcher/Sources
        excludes:
          - Info.plist
      - path: WindowsSwitcher/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moeasy.windowsswitcher
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: WindowsSwitcher/Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WindowsSwitcher/Sources/WindowsSwitcher.entitlements
        CODE_SIGN_IDENTITY: WindowsSwitcher Local Signing
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
